
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОПГ МАКАКИ 🐒</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c0b12;--panel:#15131f;--panel2:#1c1929;--purple:#9b5cff;--pink:#e05cff;--text:#f5f1ff;--muted:#9b94ad;--border:#302940;--green:#47dc91}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
#authScreen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#39205d 0,#171124 35%,#0c0b12 75%)}
.auth-card{width:min(420px,100%);background:#171421;border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:0 20px 80px #0008}
.logo{text-align:center;font-size:38px;font-weight:900;letter-spacing:2px}
.logo span{color:var(--purple)}
.sub{text-align:center;color:var(--muted);margin:8px 0 25px}
.field{width:100%;background:#0f0d17;border:1px solid var(--border);padding:14px;border-radius:11px;color:white;margin:7px 0 13px;outline:none}
.field:focus{border-color:var(--purple)}
.btn{background:linear-gradient(100deg,#8d4cff,#c04cff);color:white;padding:13px 17px;border-radius:11px;font-weight:bold}
.btn:hover{filter:brightness(1.12)}
.btn.full{width:100%}
.switch{text-align:center;color:var(--muted);margin-top:17px;font-size:14px}
.switch a{color:#c69cff;cursor:pointer}
#app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#111019;border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:900;font-size:20px;letter-spacing:1px}
.brand span{color:var(--purple)}
.userbox{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:13px;display:flex;gap:11px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#39265a;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.username{font-weight:bold;overflow-wrap:anywhere}
.rank-small{font-size:12px;color:#bd9cff;margin-top:4px}
.side-title{color:var(--muted);font-size:11px;letter-spacing:1.5px;margin:5px 0}
.side-link{padding:10px;border-radius:9px;color:#c9c2d6}
.side-link.active{background:#2a1c40;color:white}
.online-list{display:flex;flex-direction:column;gap:9px}
.online-user{font-size:13px;display:flex;align-items:center;gap:8px;color:#d7d0e3;overflow-wrap:anywhere}
.dot{width:8px;height:8px;background:var(--green);border-radius:50%;flex-shrink:0}
.logout{margin-top:auto;background:#261a31;color:#d8baff;padding:12px;border-radius:10px}
.main{min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{padding:17px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#100e18}
.topbar h2{margin:0;font-size:18px}
.online-count{color:var(--green);font-size:13px}
.chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:15px}
.message{display:flex;gap:11px;max-width:850px}
.message-body{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:11px 14px}
.message-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.message-name{font-weight:bold;color:#d9baff}
.message-rank{font-size:11px;color:#a99abf}
.message-time{font-size:11px;color:#746d80}
.message-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.message-photo{max-width:min(420px,100%);max-height:300px;border-radius:10px;margin-top:8px;display:block;object-fit:contain}
.composer{padding:15px 20px;border-top:1px solid var(--border);background:#111019}
.composer-row{display:flex;gap:10px;align-items:center}
.composer input{flex:1;min-width:0;background:#201c2b;border:1px solid var(--border);border-radius:12px;padding:14px;color:white;outline:none}
.icon-btn{background:#292238;color:#d9baff;padding:13px;border-radius:11px}
.send{background:var(--purple);color:white;padding:13px 20px;border-radius:11px;font-weight:bold}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
#profilePanel{padding:20px;overflow:auto}
.profile-card{max-width:650px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px}
.profile-head{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.profile-head .avatar{width:75px;height:75px;font-size:30px}
.profile-card label{display:block;color:var(--muted);font-size:13px;margin-top:15px}
.profile-card select{width:100%;background:#0f0d17;color:white;border:1px solid var(--border);padding:13px;border-radius:10px;margin-top:7px}
.status{color:var(--muted);font-size:13px;margin-top:10px;min-height:18px}
@media(max-width:720px){
#app{grid-template-columns:1fr}
.sidebar{display:none}
.main{height:100vh}
.chat{padding:13px}
.topbar{padding:14px}
.composer{padding:10px}
.send{padding:13px}
}
</style>
</head>
<body>

<section id="authScreen">
  <div class="auth-card">
    <div class="logo">ОПГ <span>МАКАКИ</span> 🐒</div>
    <div class="sub">Твой район. Твои правила.</div>
    <div id="loginForm">
      <h2>Вход в ОПГ</h2>
      <input class="field" id="loginName" placeholder="Твой username" maxlength="20" autocomplete="username">
      <input class="field" id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password">
      <button class="btn full" id="loginBtn">ВОЙТИ В ЧАТ</button>
      <div class="switch">Нет аккаунта? <a id="showRegister">Создать аккаунт</a></div>
    </div>
    <div id="registerForm" class="hidden">
      <h2>Новая макака 🐵</h2>
      <input class="field" id="registerName" placeholder="Username (3–20 символов)" maxlength="20" autocomplete="username">
      <input class="field" id="registerPassword" type="password" placeholder="Пароль (минимум 8 символов)" autocomplete="new-password">
      <button class="btn full" id="registerBtn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
      <div class="switch">Уже есть аккаунт? <a id="showLogin">Войти</a></div>
    </div>
    <div class="status" id="authStatus"></div>
  </div>
</section>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">ОПГ <span>МАКАКИ</span> 🐒</div>
    <div class="userbox">
      <img class="avatar" id="sideAvatar" alt="Аватар" src="">
      <div><div class="username" id="sideName"></div><div class="rank-small" id="sideRank"></div></div>
    </div>
    <div>
      <div class="side-title">МЕНЮ</div>
      <div class="side-link active" id="chatTab">💬 Общий чат</div>
      <div class="side-link" id="profileTab">👤 Мой профиль</div>
    </div>
    <div>
      <div class="side-title">В СЕТИ</div>
      <div class="online-list" id="onlineList"><span class="hint">Загрузка...</span></div>
    </div>
    <button class="logout" id="logoutBtn">Выйти из аккаунта ↗</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="pageTitle">💬 Общий чат</h2>
      <div class="online-count" id="onlineCount">● 1 онлайн</div>
    </header>

    <section id="chatPanel" style="display:flex;flex:1;min-height:0;flex-direction:column">
      <div class="chat" id="messages"></div>
      <div class="composer">
        <div class="composer-row">
          <input id="messageInput" placeholder="Напиши что-нибудь, макака..." maxlength="500">
          <input id="photoInput" type="file" accept="image/*" hidden>
          <button class="icon-btn" id="photoBtn" title="Прикрепить фото">📷</button>
          <button class="send" id="sendBtn">➤</button>
        </div>
        <div class="hint" id="selectedPhoto">Сообщения видны всем участникам ОПГ.</div>
      </div>
    </section>

    <section id="profilePanel" class="hidden">
      <div class="profile-card">
        <div class="profile-head">
          <img class="avatar" id="profileAvatar" alt="Аватар" src="">
          <div><h2 id="profileName" style="margin:0 0 7px"></h2><div class="rank-small" id="profileRank"></div></div>
        </div>
        <label>Изменить аватар</label>
        <input class="field" type="file" id="avatarInput" accept="image/*">
        <label>Выбери себе ранг</label>
        <select id="rankSelect"></select>
        <button class="btn" id="saveProfile" style="margin-top:15px">СОХРАНИТЬ ПРОФИЛЬ</button>
        <div class="status" id="profileStatus"></div>
      </div>
    </section>
  </main>
</div>

<script>
const SUPABASE_URL = "https://yixjcoqrtpjanlosrloi.supabase.co";
const SUPABASE_KEY = "sb_publishable_-cYnU1bmLnBkoszRDzFQ8A_J8LMt1f7";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const RANKS = [
"🐣 Фраер","🚬 Чушпан","🐒 Пацанчик","🥷 На районе","💰 Решала",
"🧥 Авторитет","👑 Вор в законе","💀 Король района","🍌 Банановый магнат",
"🗿 Сигма-макака","🤡 Главный клоун","💀 NPC района","🧠 Последний нейрон",
"🚽 Легенда туалета","🦍 Батя горилл","📉 Жертва алгебры",
"🧹 Повелитель швабры","🥶 Холодный тип","🐀 Крыса века",
"🧃 Соковый миллионер","🧠 Мозг операции","💎 Элитная макака",
"🔥 Легенда джунглей"
];

let currentUser = null;
let myProfile = null;
let selectedPhoto = null;
let chatChannel = null;
let presenceChannel = null;
let onlineUsers = {};

const $ = id => document.getElementById(id);
const usernameToEmail = name => name.toLowerCase() + "@opg-makaki.invalid";

function setStatus(id, text, error=false){
  $(id).textContent = text;
  $(id).style.color = error ? "#ff8585" : "#a99abf";
}
function validUsername(name){
  return /^[a-zA-Z0-9_]{3,20}$/.test(name);
}
function showAuth(){
  $("authScreen").classList.remove("hidden");
  $("app").classList.add("hidden");
}
function showApp(){
  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
}
function safeImage(img, url){
  img.src = url || "";
  img.onerror = () => { img.removeAttribute("src"); img.alt = "🐒"; };
}

$("showRegister").onclick = () => {
  $("loginForm").classList.add("hidden");
  $("registerForm").classList.remove("hidden");
  setStatus("authStatus","");
};
$("showLogin").onclick = () => {
  $("registerForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
  setStatus("authStatus","");
};

$("registerBtn").onclick = async () => {
  const username = $("registerName").value.trim();
  const password = $("registerPassword").value;
  if(!validUsername(username)){
    return setStatus("authStatus","Username: только латинские буквы, цифры и _, от 3 до 20 символов.",true);
  }
  if(password.length < 8) return setStatus("authStatus","Пароль должен быть не короче 8 символов.",true);
  $("registerBtn").disabled = true;
  setStatus("authStatus","Создаём аккаунт...");
  const {data,error} = await db.auth.signUp({
    email: usernameToEmail(username),
    password,
    options:{data:{username}}
  });
  $("registerBtn").disabled = false;
  if(error) return setStatus("authStatus",error.message,true);
  if(data.session){
    await startApp(data.session.user);
  }else{
    setStatus("authStatus","Аккаунт создан. Если подтверждение email выключено, теперь войди в аккаунт.");
  }
};

$("loginBtn").onclick = async () => {
  const username = $("loginName").value.trim();
  const password = $("loginPassword").value;
  if(!validUsername(username)) return setStatus("authStatus","Проверь username.",true);
  $("loginBtn").disabled = true;
  setStatus("authStatus","Входим...");
  const {data,error} = await db.auth.signInWithPassword({
    email:usernameToEmail(username),password
  });
  $("loginBtn").disabled = false;
  if(error) return setStatus("authStatus","Не удалось войти: "+error.message,true);
  await startApp(data.user);
};

async function loadProfile(){
  const {data,error} = await db.from("profiles").select("*").eq("id",currentUser.id).single();
  if(error) throw error;
  myProfile = data;
  $("sideName").textContent = data.username;
  $("sideRank").textContent = data.rank;
  $("profileName").textContent = data.username;
  $("profileRank").textContent = data.rank;
  safeImage($("sideAvatar"),data.avatar_url);
  safeImage($("profileAvatar"),data.avatar_url);
  $("rankSelect").innerHTML = "";
  RANKS.forEach(rank=>{
    const option = document.createElement("option");
    option.value = rank;
    option.textContent = rank;
    $("rankSelect").appendChild(option);
  });
  $("rankSelect").value = data.rank;
}

async function startApp(user){
  currentUser = user;
  try{
    await loadProfile();
    showApp();
    await loadMessages();
    startRealtime();
    startPresence();
  }catch(error){
    setStatus("authStatus","Ошибка загрузки профиля: "+error.message,true);
    showAuth();
  }
}

async function loadMessages(){
  const {data,error} = await db.from("messages")
    .select("id,user_id,nickname,content,image_url,created_at")
    .order("created_at",{ascending:true}).limit(100);
  if(error) throw error;
  $("messages").innerHTML = "";
  for(const message of data) await addMessage(message);
  $("messages").scrollTop = $("messages").scrollHeight;
}

async function addMessage(message){
  const row = document.createElement("div");
  row.className = "message";
  const avatar = document.createElement("img");
  avatar.className = "avatar";
  avatar.alt = "аватар";
  const body = document.createElement("div");
  body.className = "message-body";
  const head = document.createElement("div");
  head.className = "message-head";
  const name = document.createElement("span");
  name.className = "message-name";
  const rank = document.createElement("span");
  rank.className = "message-rank";
  const time = document.createElement("span");
  time.className = "message-time";
  const text = document.createElement("div");
  text.className = "message-text";

  let profile = null;
  if(message.user_id){
    const {data} = await db.from("profiles").select("username,rank,avatar_url").eq("id",message.user_id).maybeSingle();
    profile = data;
  }
  name.textContent = profile?.username || message.nickname || "Макака";
  rank.textContent = profile?.rank || "";
  time.textContent = message.created_at ? new Date(message.created_at).toLocaleString("ru-RU") : "";
  text.textContent = message.content || "";
  safeImage(avatar,profile?.avatar_url);
  head.append(name,rank,time);
  body.append(head);
  if(message.content) body.append(text);
  if(message.image_url){
    const photo = document.createElement("img");
    photo.className = "message-photo";
    photo.src = message.image_url;
    photo.alt = "Фото из чата";
    photo.loading = "lazy";
    body.append(photo);
  }
  row.append(avatar,body);
  $("messages").append(row);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function startRealtime(){
  if(chatChannel) db.removeChannel(chatChannel);
  chatChannel = db.channel("makaki-chat")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{
      addMessage(payload.new);
    }).subscribe();
}

async function startPresence(){
  if(presenceChannel) db.removeChannel(presenceChannel);
  presenceChannel = db.channel("makaki-online",{config:{presence:{key:currentUser.id}}});
  presenceChannel
    .on("presence",{event:"sync"},()=>{
      const state = presenceChannel.presenceState();
      onlineUsers = {};
      Object.values(state).flat().forEach(item=>{
        onlineUsers[item.user_id] = item.username;
      });
      renderOnline();
    })
    .subscribe(async status=>{
      if(status==="SUBSCRIBED"){
        await presenceChannel.track({
          user_id:currentUser.id,
          username:myProfile.username,
          online_at:new Date().toISOString()
        });
      }
    });
}

function renderOnline(){
  const entries = Object.entries(onlineUsers);
  $("onlineCount").textContent = "● "+entries.length+" онлайн";
  $("onlineList").innerHTML = "";
  if(!entries.length){
    $("onlineList").textContent = "Пока никого";
    return;
  }
  entries.forEach(([id,name])=>{
    const item = document.createElement("div");
    item.className = "online-user";
    const dot = document.createElement("span");
    dot.className = "dot";
    const label = document.createElement("span");
    label.textContent = name + (id===currentUser.id ? " (ты)" : "");
    item.append(dot,label);
    $("onlineList").append(item);
  });
}

async function uploadImage(file,folder){
  if(!file || !file.type.startsWith("image/")) throw new Error("Выбери изображение.");
  if(file.size > 5*1024*1024) throw new Error("Максимальный размер фото — 5 МБ.");
  const ext = file.name.split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const path = currentUser.id+"/"+folder+"-"+Date.now()+"."+ext;
  const {error} = await db.storage.from("makaki-files").upload(path,file,{upsert:true});
  if(error) throw error;
  return db.storage.from("makaki-files").getPublicUrl(path).data.publicUrl;
}

$("photoBtn").onclick = () => $("photoInput").click();
$("photoInput").onchange = event => {
  selectedPhoto = event.target.files[0] || null;
  $("selectedPhoto").textContent = selectedPhoto ? "Фото выбрано: "+selectedPhoto.name : "Сообщения видны всем участникам ОПГ.";
};

$("sendBtn").onclick = sendMessage;
$("messageInput").addEventListener("keydown",event=>{
  if(event.key==="Enter") sendMessage();
});

async function sendMessage(){
  const content = $("messageInput").value.trim();
  const file = selectedPhoto;
  if(!content && !file) return;
  $("sendBtn").disabled = true;
  setStatus("selectedPhoto","Отправляем...");
  try{
    let image_url = null;
    if(file) image_url = await uploadImage(file,"chat");
    const {error} = await db.from("messages").insert({
      user_id:currentUser.id,
      nickname:myProfile.username,
      content:content || "📷 Фото",
      image_url
    });
    if(error) throw error;
    $("messageInput").value = "";
    $("photoInput").value = "";
    selectedPhoto = null;
    $("selectedPhoto").textContent = "Сообщения видны всем участникам ОПГ.";
  }catch(error){
    $("selectedPhoto").textContent = "Ошибка: "+error.message;
  }
  $("sendBtn").disabled = false;
}

$("chatTab").onclick = () => {
  $("chatPanel").classList.remove("hidden");
  $("profilePanel").classList.add("hidden");
  $("chatTab").classList.add("active");
  $("profileTab").classList.remove("active");
  $("pageTitle").textContent = "💬 Общий чат";
};
$("profileTab").onclick = () => {
  $("chatPanel").classList.add("hidden");
  $("profilePanel").classList.remove("hidden");
  $("profileTab").classList.add("active");
  $("chatTab").classList.remove("active");
  $("pageTitle").textContent = "👤 Мой профиль";
};

$("saveProfile").onclick = async () => {
  $("saveProfile").disabled = true;
  setStatus("profileStatus","Сохраняем...");
  try{
    let avatar_url = myProfile.avatar_url;
    const file = $("avatarInput").files[0];
    if(file) avatar_url = await uploadImage(file,"avatar");
    const rank = $("rankSelect").value;
    const {error} = await db.from("profiles").update({rank,avatar_url}).eq("id",currentUser.id);
    if(error) throw error;
    await loadProfile();
    setStatus("profileStatus","Профиль сохранён!");
  }catch(error){
    setStatus("profileStatus","Ошибка: "+error.message,true);
  }
  $("saveProfile").disabled = false;
};

$("logoutBtn").onclick = async () => {
  if(presenceChannel) await db.removeChannel(presenceChannel);
  if(chatChannel) await db.removeChannel(chatChannel);
  await db.auth.signOut();
  currentUser = null;
  myProfile = null;
  showAuth();
};

db.auth.getSession().then(({data})=>{
  if(data.session) startApp(data.session.user);
});
db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){
    currentUser = null;
    myProfile = null;
    showAuth();
  }
});
</script>
</body>
</html>
